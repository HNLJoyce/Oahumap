<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Encampment IDs</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet.fullscreen@3.0.0/Control.FullScreen.css">
  <script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leaflet.fullscreen@3.0.0/Control.FullScreen.min.js"></script>
  <style>
    :root {
      --ink: #1b2433;
      --muted: #5d6b7e;
      --line: #e3e8ef;
      --panel: #ffffff;
      --accent: #0f6e8c;
      --c0: #9aa5b4;
      --c1: #f6c453;
      --c2: #ef8a3c;
      --c3: #d9482b;
      --c4: #8f1d3a;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { font-family: 'Jost', Arial, sans-serif; color: var(--ink); display: flex; }

    /* ---------- Sidebar ---------- */
    #panel {
      width: 340px; flex: 0 0 340px; height: 100%;
      background: var(--panel); border-right: 1px solid var(--line);
      display: flex; flex-direction: column; z-index: 1000;
      box-shadow: 2px 0 12px rgba(20,30,50,.08);
    }
    .head { padding: 20px 20px 14px; border-bottom: 1px solid var(--line); }
    .head h1 { font-size: 24px; font-weight: 700; margin: 0 0 4px; letter-spacing: -.2px; }
    .head .sub { font-size: 13.5px; line-height: 1.45; color: var(--muted); margin: 0; }
    .head .updated {
      display: inline-block; margin-top: 10px; font-size: 12px; font-weight: 600;
      color: var(--accent); border: 1px solid #b9dbe6; border-radius: 999px; padding: 2px 10px;
    }

    .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--line); }
    .stat { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
    .stat .num { font-size: 26px; font-weight: 700; line-height: 1.1; }
    .stat .lbl { font-size: 12px; color: var(--muted); }

    .legend { padding: 12px 20px 14px; border-bottom: 1px solid var(--line); }
    .legend .title { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin-bottom: 8px; }
    .legend .rows { display: flex; flex-wrap: wrap; gap: 6px 14px; }
    .legend .row { display: flex; align-items: center; gap: 6px; font-size: 13px; cursor: pointer; user-select: none; }
    .legend .row.off { opacity: .35; }
    .dot { display: inline-block; border-radius: 50%; border: 1.5px solid #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.18); }
    .legend .hint { font-size: 11.5px; color: var(--muted); margin-top: 8px; }

    .search { padding: 12px 20px 8px; }
    .search input {
      width: 100%; font: inherit; font-size: 14px; padding: 9px 12px;
      border: 1px solid #cfd7e2; border-radius: 8px; outline: none;
    }
    .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(15,110,140,.15); }
    .sortbar { display: flex; justify-content: space-between; align-items: center; padding: 0 20px 6px; font-size: 12px; color: var(--muted); }
    .sortbar select { font: inherit; font-size: 12px; border: 1px solid #cfd7e2; border-radius: 6px; padding: 2px 4px; color: var(--ink); background: #fff; }

    #list { list-style: none; margin: 0; padding: 0 10px 16px; overflow-y: auto; flex: 1; }
    #list li {
      display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; cursor: pointer;
    }
    #list li:hover, #list li.active { background: #eef5f8; }
    #list .addr { flex: 1; font-size: 13.5px; line-height: 1.3; }
    #list .cnt { font-weight: 700; font-size: 14px; min-width: 38px; text-align: right; }
    #list .empty { color: var(--muted); font-size: 13px; padding: 10px; cursor: default; }

    #map { flex: 1; height: 100%; }

    /* ---------- Map chrome ---------- */
    .leaflet-container { font-family: 'Jost', Arial, sans-serif; background: #e8ecef; }
    .leaflet-popup-content-wrapper { border-radius: 10px; }
    .leaflet-popup-content { margin: 12px 14px; font-size: 14px; line-height: 1.45; min-width: 200px; }
    .pop-addr { font-weight: 700; font-size: 15px; margin-bottom: 6px; }
    .pop-count { font-size: 13px; color: var(--muted); }
    .pop-count b { font-size: 22px; color: var(--ink); margin-right: 4px; }
    .pop-hist { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--muted); }
    .pop-links { margin-top: 8px; font-size: 12.5px; }
    .pop-links a { color: var(--accent); text-decoration: none; font-weight: 600; margin-right: 12px; }
    .pop-links a:hover { text-decoration: underline; }
    .leaflet-tooltip { font-family: 'Jost', Arial, sans-serif; font-size: 13px; }

    #toggle {
      display: none; position: absolute; z-index: 1100; top: 10px; left: 50%; transform: translateX(-50%);
      font: inherit; font-size: 14px; font-weight: 600; padding: 8px 16px; border-radius: 999px;
      border: none; background: var(--ink); color: #fff; box-shadow: 0 3px 10px rgba(0,0,0,.25); cursor: pointer;
    }

    /* ---------- Mobile ---------- */
    @media (max-width: 760px) {
      body { display: block; }
      #map { position: absolute; inset: 0; }
      #panel {
        position: absolute; left: 0; right: 0; bottom: 0; width: 100%; height: 62%;
        border-right: none; border-top-left-radius: 16px; border-top-right-radius: 16px;
        box-shadow: 0 -4px 18px rgba(0,0,0,.18); transform: translateY(100%); transition: transform .25s ease;
      }
      body.panel-open #panel { transform: translateY(0); }
      #toggle { display: block; }
      .head { padding: 14px 16px 10px; }
      .head h1 { font-size: 20px; }
      .stats, .legend, .search, .sortbar { padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>
<body>
  <aside id="panel">
    <div class="head">
      <h1>Encampment IDs</h1>
      <p class="sub">Field observations by the Department of Community Services’ Homeless Solutions team. Circle size and color show the number of people observed.</p>
    </div>
    <div class="stats">
      <div class="stat"><div class="num" id="statSites">–</div><div class="lbl">Locations</div></div>
      <div class="stat"><div class="num" id="statPeople">–</div><div class="lbl">People observed (latest per location)</div></div>
    </div>
    <div class="legend">
      <div class="title">People observed</div>
      <div class="rows" id="legendRows"></div>
      <div class="hint">Click a legend item to show or hide it.</div>
    </div>
    <div class="search"><input id="q" type="search" placeholder="Search an address or place…" autocomplete="off"></div>
    <div class="sortbar">
      <span id="shown"></span>
      <label>Sort
        <select id="sort">
          <option value="count">Most people</option>
          <option value="name">A–Z</option>
        </select>
      </label>
    </div>
    <ul id="list"></ul>
  </aside>
  <div id="map"></div>
  <button id="toggle" type="button">Show list</button>

1004 Kilani Ave","count":"2","value":2.0,"lat":21.499951,"lon":-158.025191},{"row":122,"address":"207 N Cane street","count":"1","value":1.0,"lat":21.499948,"lon":-158.025266},{"row":123,"address":"966 California Ave","count":"1","value":1.0,"lat":21.49826,"lon":-158.02463},{"row":124,"address":"Baby Makapuu Beach","count":"15","value":15.0,"lat":21.316488,"lon":-157.664261},{"row":125,"address":"7788 Hawaii Kai Drive","count":"3","value":3.0,"lat":21.294695,"lon":-157.685247},{"row":126,"address":"2312 Coyne Street","count":"0","value":0.0,"lat":21.2919,"lon":-157.8227},{"row":127,"address":"2237 S. King street","count":"10","value":10.0,"lat":21.2929,"lon":-157.8261},{"row":128,"address":"1461 Young Street","count":"10","value":10.0,"lat":21.29829,"lon":-157.83827},{"row":129,"address":"929 Pumehana Street","count":"0","value":0.0,"lat":21.294666,"lon":-157.831274},{"row":130,"address":"Alan Davis Beach","count":"4","value":4.0,"lat":21.29841,"lon":-157.65491},{"row":131,"address":"2357 S. Beretania St","count":"3","value":3.0,"lat":21.2949,"lon":-157.824},{"row":132,"address":"1995 S King street","count":"1","value":1.0,"lat":21.29513,"lon":-157.83125},{"row":133,"address":"1115 Isenberg street","count":"6","value":6.0,"lat":21.29401,"lon":-157.82493},{"row":134,"address":"Makahiki Way","count":"2","value":2.0,"lat":21.2894,"lon":-157.8234},{"row":135,"address":"1461 Young street","count":"5","value":5.0,"lat":21.29829,"lon":-157.83827},{"row":136,"address":"2237 King street","count":"10","value":10.0,"lat":21.2929,"lon":-157.8261},{"row":137,"address":"Mother Waldron Park","count":"6","value":6.0,"lat":21.2948,"lon":-157.858}];

    // ---------- Buckets (color + legend) ----------
    const buckets = [
      { key: 'b0', label: 'None seen', min: 0,  max: 0,        color: getCss('--c0') },
      { key: 'b1', label: '1–4',       min: 0.01, max: 4.99,   color: getCss('--c1') },
      { key: 'b2', label: '5–14',      min: 5,  max: 14.99,    color: getCss('--c2') },
      { key: 'b3', label: '15–29',     min: 15, max: 29.99,    color: getCss('--c3') },
      { key: 'b4', label: '30+',       min: 30, max: Infinity, color: getCss('--c4') }
    ];
    function getCss(v) { return getComputedStyle(document.documentElement).getPropertyValue(v).trim(); }
    function bucketFor(v) { return buckets.find(b => v >= b.min && v <= b.max) || buckets[0]; }
    function radiusFor(v) { return v <= 0 ? 6 : Math.min(22, 7 + Math.sqrt(v) * 2.2); }
    function esc(value) {
      return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
    }
    const clean = s => String(s).replace(/\s*\n\s*/g, ' — ').trim();

    // ---------- Map + basemaps (all zoom to street level) ----------
    const map = L.map('map', {
      center: [21.42, -157.96], zoom: 10, minZoom: 9, maxZoom: 21,
      zoomControl: false, fullscreenControl: false
    });
    L.control.zoom({ position: 'topright' }).addTo(map);
    L.control.fullscreen({ position: 'topright', title: 'Full screen', titleCancel: 'Exit full screen' }).addTo(map);
    L.control.scale({ position: 'bottomright', imperial: true, metric: false }).addTo(map);

    // All basemaps below are free and need no API key.
    const esriBase = 'https://server.arcgisonline.com/ArcGIS/rest/services/';
    const esriStreets = L.tileLayer(esriBase + 'World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
      maxNativeZoom: 19, maxZoom: 21,
      attribution: 'Tiles &copy; Esri, HERE, Garmin, &copy; OpenStreetMap contributors'
    });
    const esriTopo = L.tileLayer(esriBase + 'World_Topo_Map/MapServer/tile/{z}/{y}/{x}', {
      maxNativeZoom: 19, maxZoom: 21,
      attribution: 'Tiles &copy; Esri, HERE, Garmin, USGS, &copy; OpenStreetMap contributors'
    });
    const hot = L.tileLayer('https://{s}.tile.openstreetmap.fr/hot/{z}/{x}/{y}.png', {
      maxNativeZoom: 19, maxZoom: 21, subdomains: 'abc',
      attribution: '&copy; OpenStreetMap contributors, Tiles style by Humanitarian OpenStreetMap Team'
    });
    const satellite = L.tileLayer(esriBase + 'World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      maxNativeZoom: 19, maxZoom: 21,
      attribution: 'Imagery &copy; Esri, Maxar, Earthstar Geographics'
    });
    const roadLabels = L.tileLayer(esriBase + 'Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}', {
      maxNativeZoom: 19, maxZoom: 21, pane: 'shadowPane'
    });
    const placeLabels = L.tileLayer(esriBase + 'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}', {
      maxNativeZoom: 19, maxZoom: 21, pane: 'shadowPane'
    });
    const satWithLabels = L.layerGroup([satellite, roadLabels, placeLabels]);
    esriStreets.addTo(map);
    L.control.layers({ 'Streets': esriStreets, 'Topographic': esriTopo, 'Satellite + labels': satWithLabels, 'Humanitarian (original style)': hot }, null,
      { position: 'topright', collapsed: true }).addTo(map);

    // ---------- Group rows that share a point ----------
    const groups = new Map();
    locations.forEach(item => {
      const key = `${item.lat.toFixed(6)},${item.lon.toFixed(6)}`;
      if (!groups.has(key)) groups.set(key, []);
      groups.get(key).push(item);
    });

    // ---------- Markers ----------
    const entries = [];      // one per row, for list + filtering
    const hidden = new Set();
    const markerLayer = L.featureGroup().addTo(map);

    groups.forEach(items => {
      items.forEach((item, i) => {
        let lat = item.lat, lon = item.lon;
        if (items.length > 1) {                // fan out overlapping points slightly
          const angle = (2 * Math.PI * i) / items.length;
          lat += Math.sin(angle) * 0.00018;
          lon += Math.cos(angle) * 0.00018;
        }
        const b = bucketFor(item.value);
        const marker = L.circleMarker([lat, lon], {
          radius: radiusFor(item.value),
          color: '#ffffff', weight: 1.75,
          fillColor: b.color, fillOpacity: item.value <= 0 ? 0.75 : 0.88
        });

        const others = items.filter(o => o !== item);
        const hist = others.length
          ? `<div class="pop-hist">Other observations at this point: ${others.map(o => `<b>${esc(o.count)}</b>`).join(', ')}</div>`
          : '';
        const q = encodeURIComponent(`${item.lat},${item.lon}`);
        marker.bindPopup(
          `<div class="pop-addr">${esc(item.address).replace(/\n/g, '<br>')}</div>
           <div class="pop-count"><b>${esc(item.count)}</b>people observed</div>
           ${hist}
           <div class="pop-links">
             <a href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">Google Maps</a>
             <a href="https://www.google.com/maps/@?api=1&map_action=pano&viewpoint=${q}" target="_blank" rel="noopener">Street View</a>
           </div>`,
          { maxWidth: 320 }
        );
        marker.bindTooltip(`${esc(clean(item.address))} · ${esc(item.count)}`, { direction: 'top', offset: [0, -6] });

        const entry = { item, marker, bucket: b.key, text: clean(item.address).toLowerCase() };
        marker.on('click', () => highlight(entry));
        entries.push(entry);
      });
    });

    // Draw bigger circles first so small ones stay clickable on top
    entries.slice().sort((a, b) => b.item.value - a.item.value).forEach(e => e.marker.addTo(markerLayer));

    // ---------- Stats (latest row per point counts once) ----------
    let people = 0;
    groups.forEach(items => { people += items.reduce((m, x) => (x.row > m.row ? x : m)).value; });
    document.getElementById('statSites').textContent = groups.size.toLocaleString();
    document.getElementById('statPeople').textContent = Math.round(people).toLocaleString() + '+';

    // ---------- Legend ----------
    const legendRows = document.getElementById('legendRows');
    buckets.forEach(b => {
      const n = entries.filter(e => e.bucket === b.key).length;
      const sample = b.key === 'b0' ? 0 : b.min;
      const size = Math.round(radiusFor(Math.max(sample, b.key === 'b0' ? 0 : 1)) * 2 * 0.75);
      const row = document.createElement('div');
      row.className = 'row';
      row.innerHTML = `<span class="dot" style="width:${size}px;height:${size}px;background:${b.color}"></span>${b.label} <span style="color:var(--muted)">(${n})</span>`;
      row.addEventListener('click', () => {
        hidden.has(b.key) ? hidden.delete(b.key) : hidden.add(b.key);
        row.classList.toggle('off', hidden.has(b.key));
        render();
      });
      legendRows.appendChild(row);
    });

    // ---------- List + search ----------
    const listEl = document.getElementById('list');
    const qEl = document.getElementById('q');
    const sortEl = document.getElementById('sort');
    let activeEntry = null;

    function render() {
      const q = qEl.value.trim().toLowerCase();
      const visible = entries.filter(e => !hidden.has(e.bucket) && (!q || e.text.includes(q)));
      entries.forEach(e => {
        const show = visible.includes(e);
        if (show && !markerLayer.hasLayer(e.marker)) markerLayer.addLayer(e.marker);
        if (!show && markerLayer.hasLayer(e.marker)) markerLayer.removeLayer(e.marker);
      });
      const sorted = visible.slice().sort(sortEl.value === 'name'
        ? (a, b) => a.text.localeCompare(b.text)
        : (a, b) => b.item.value - a.item.value || a.text.localeCompare(b.text));
      listEl.innerHTML = '';
      if (!sorted.length) {
        listEl.innerHTML = '<li class="empty">No matching locations.</li>';
      }
      sorted.forEach(e => {
        const li = document.createElement('li');
        const b = buckets.find(x => x.key === e.bucket);
        li.innerHTML = `<span class="dot" style="width:12px;height:12px;background:${b.color}"></span>
                        <span class="addr">${esc(clean(e.item.address))}</span>
                        <span class="cnt">${esc(e.item.count)}</span>`;
        li.addEventListener('click', () => {
          map.flyTo(e.marker.getLatLng(), Math.max(map.getZoom(), 18), { duration: 0.8 });
          map.once('moveend', () => e.marker.openPopup());
          highlight(e);
          document.body.classList.remove('panel-open');
          toggleBtn.textContent = 'Show list';
        });
        e.li = li;
        listEl.appendChild(li);
      });
      document.getElementById('shown').textContent = `${sorted.length} of ${entries.length} observations`;
      if (activeEntry && activeEntry.li) activeEntry.li.classList.add('active');
    }

    function highlight(entry) {
      if (activeEntry && activeEntry.li) activeEntry.li.classList.remove('active');
      activeEntry = entry;
      if (entry.li) {
        entry.li.classList.add('active');
        entry.li.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    }

    qEl.addEventListener('input', render);
    sortEl.addEventListener('change', render);
    render();

    // Fit to all points on load
    map.fitBounds(markerLayer.getBounds(), { padding: [30, 30] });

    // ---------- Mobile panel toggle ----------
    const toggleBtn = document.getElementById('toggle');
    toggleBtn.addEventListener('click', () => {
      const open = document.body.classList.toggle('panel-open');
      toggleBtn.textContent = open ? 'Show map' : 'Show list';
    });
    window.addEventListener('resize', () => map.invalidateSize());
  </script>
