      {opacity:1, interactive:false}
    ).addTo(map);

    L.control.scale().addTo(map);
    L.control.fullscreen({ position:'topleft', title:'Full Screen', titleCancel:'Exit Full Screen' }).addTo(map);

    const maxValue = Math.max(...locations.map(x => x.value), 1);
    function escapeText(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
      }[char]));
    }

    function markerColor(value) {
      const ratio = value / maxValue;
      if (ratio >= .72) return '#ffd166';
      if (ratio >= .45) return '#ff4ecd';
      if (ratio >= .15) return '#7b61ff';
      return '#2de2e6';
    }

    const coordTotals = new Map();
    locations.forEach(item => {
      const key = `${item.lat.toFixed(6)},${item.lon.toFixed(6)}`;
      coordTotals.set(key, (coordTotals.get(key) || 0) + 1);
    });
    const coordSeen = new Map();

    locations.forEach((item, index) => {
      const key = `${item.lat.toFixed(6)},${item.lon.toFixed(6)}`;
      const totalAtPoint = coordTotals.get(key) || 1;
      const seen = coordSeen.get(key) || 0;
      coordSeen.set(key, seen + 1);

      let displayLat = item.lat;
      let displayLon = item.lon;
      if (totalAtPoint > 1) {
        const angle = (2 * Math.PI * seen) / totalAtPoint;
        const offset = 0.00022;
        displayLat += Math.sin(angle) * offset;
        displayLon += Math.cos(angle) * offset;
      }

      const radius = Math.max(5.5, Math.min(11.5, 5.5 + Math.sqrt(Math.max(item.value, 1)) * 0.75));
      const isNew = index >= 136;

      const marker = L.circleMarker([displayLat, displayLon], {
        radius: isNew ? radius : Math.max(radius, 13),
        color: isNew ? '#ffffff' : 'transparent',
        weight: isNew ? 1.5 : 0,
        fillColor: isNew ? markerColor(item.value) : 'transparent',
        fillOpacity: isNew ? .90 : 0.001,
        opacity: isNew ? 1 : 0.001,
        bubblingMouseEvents: false
      }).addTo(map);

      const address = escapeText(item.address).replace(/\n/g, '<br>');
      marker.bindPopup(`<b>${address}</b><br>People observed: ${escapeText(item.count)}`, {maxWidth:360});
      marker.bindTooltip(`${escapeText(item.address.replace(/\n/g,' '))} · ${escapeText(item.count)}`, {sticky:true});
    });
