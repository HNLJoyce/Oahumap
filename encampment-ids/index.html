    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
      maxZoom:20,
      attribution:'&copy; OpenStreetMap contributors &copy; CARTO'
    }).addTo(map);
    L.control.scale().addTo(map);
    L.control.fullscreen({ position:'topleft', title:'Full Screen', titleCancel:'Exit Full Screen' }).addTo(map);

    const maxValue = Math.max(...locations.map(x => x.value), 1);
    L.heatLayer(
      locations.filter(x => x.value > 0).map(x => [x.lat, x.lon, x.value]),
      {
        minOpacity:.30, maxZoom:18, radius:28, blur:22,
        gradient:{0.15:'#2de2e6',0.45:'#7b61ff',0.72:'#ff4ecd',1:'#ffd166'}
      }
    ).addTo(map);

    function escapeText(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
      }[char]));
    }

    function markerColor(value) {
      const ratio = value / maxValue;
      if (ratio >= .72) return '#ffd166';
      if (ratio >= .45) return '#ff4ecd';
      if (ratio >= .15) return '#7b61ff';
      return '#2de2e6';
    }

    locations.forEach(item => {
      const radius = Math.max(6.8, Math.min(16, 6.8 + Math.sqrt(Math.max(item.value, 1)) * 1.25));
      const marker = L.circleMarker([item.lat, item.lon], {
        radius: radius,
        color:'#ffffff',
        weight:2,
        fillColor:markerColor(item.value),
        fillOpacity:.75
      }).addTo(map);

      const address = escapeText(item.address).replace(/\n/g, '<br>');
      marker.bindPopup(`<b>${address}</b><br>People observed: ${escapeText(item.count)}`, {maxWidth:360});
      marker.bindTooltip(`${escapeText(item.address.replace(/\n/g,' '))} · ${escapeText(item.count)}`, {sticky:true});
