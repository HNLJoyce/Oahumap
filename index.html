<title>Homeless Resources on Oʻahu</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">

<style>
html,body{height:100%;margin:0;font-family:Arial,sans-serif;color:#172033}
.app{height:100%;display:grid;grid-template-columns:minmax(0,1fr) 390px;grid-template-rows:auto 1fr}
header{grid-column:1/-1;background:linear-gradient(90deg,#0f172a,#1e3a8a);color:white;padding:16px 22px}
h1{margin:0;font-size:30px}.sub{font-size:13px;opacity:.86;margin-top:4px}
#map{height:100%;min-height:700px}
aside{overflow:auto;border-left:1px solid #dbe3ef;padding:15px;background:#fff}
label{display:block;font-size:12px;font-weight:700;margin:8px 0 4px}
input,select,button{box-sizing:border-box;width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:10px;font-size:14px;background:#fff}
button{margin-top:9px;font-weight:bold;cursor:pointer}
#count{font-weight:bold;margin:12px 0 10px}
.card{border:1px solid #dbe3ef;border-left:7px solid #64748b;border-radius:12px;padding:10px;margin-bottom:8px;cursor:pointer}
.card.unmapped{opacity:.78;border-left-style:dashed}
.name{font-weight:bold}.meta{font-size:12px;color:#5f6b7a;margin-top:4px}
.marker{width:18px;height:18px;border-radius:50%;border:3px solid white;box-shadow:0 0 0 2px rgba(0,0,0,.16)}
.status{font-size:12px;color:#475569;margin-top:7px}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:5px 10px;margin:12px 0;font-size:12px}
.legend-item{display:flex;align-items:center;gap:7px}
.legend-dot{width:11px;height:11px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.leaflet-popup-content{min-width:245px;font-size:13px;line-height:1.4}
.popup-title{font-weight:900;font-size:15px;margin-bottom:4px}
.popup-agency{color:#475569;margin-bottom:7px}
.popup-grid{display:grid;grid-template-columns:112px 1fr;gap:4px 8px}
.popup-label{font-weight:800;color:#475569}
.badges{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.badge{border-radius:999px;background:#eef2ff;color:#334155;padding:2px 7px;font-size:11px;font-weight:700}
@media(max-width:900px){.app{grid-template-columns:1fr;grid-template-rows:auto 55vh auto}aside{border-left:0;border-top:1px solid #dbe3ef}#map{min-height:55vh}}
</style>
</head>
<body>
<div class="app">
<header>

</header>
<div id="map"></div>
<aside>
  <label for="search">Search</label>

  <label for="type">Facility type</label>

    <option value="Hospital">Hospital</option>
    <option value="Medical Respite">Medical Respite</option>
    <option value="Permanent Supportive Housing">Permanent Supportive Housing</option>
    <option value="Transitional Housing">Transitional Housing</option>
    <option value="Treatment Center">Treatment Center</option>
  </select>

  <label for="services">Services for</label>

    <option value="">All services for</option>
    <option value="Adults">Adults</option>
    <option value="Adult Men">Adult Men</option>
    <option value="Adult Women">Adult Women</option>
    <option value="Couples">Couples</option>
    <option value="Families">Families</option>
    <option value="Youth">Youth</option>
    <option value="All Populations">All Populations</option>
  </select>

  <label for="district">City Council district</label>
  <select id="district">
    <option value="">All districts</option>
    <option value="1">District 1</option><option value="2">District 2</option>
    <option value="3">District 3</option><option value="4">District 4</option>
    <option value="5">District 5</option><option value="6">District 6</option>
    <option value="7">District 7</option><option value="8">District 8</option>
    <option value="9">District 9</option>
  </select>

  <button id="reset" type="button">Reset filters</button>
  <div id="status" class="status">Filters ready.</div>
  <div id="legend" class="legend"></div>
  <div id="count"></div>
  <div id="list"></div>
</aside>
</div>

": "Women in Need (Aiea)", "KCC": "", "Capacity": "12 4 BR\n(~24)", "Support/Service Animals": "", "Fee": "sliding scale", "City Council District": "8", "Agency": "Women in Need", "Facility Type": "Transitional Housing", "Specialty": "Women, sober living", "Address": "98-1238 Kaahumanu St., Ste. #403 Pearl City, HI 96782", "Phone": "(808)486-1996", "Services for": "Adults, Families", "lat": 21.391, "lng": -157.949, "hasFee": true, "hasAnimal": false, "hasLocation": true}, {"id": 84, "Name": "Women in Need (Halawa)", "KCC": "", "Capacity": "12 4 BR\n(~24)", "Support/Service Animals": "", "Fee": "sliding scale", "City Council District": "8", "Agency": "Women in Need", "Facility Type": "Transitional Housing", "Specialty": "Women, sober living", "Address": "98-1238 Kaahumanu St., Ste. #403 Pearl City, HI 96782", "Phone": "(808)486-1996", "Services for": "Adults, Families", "lat": 21.3907, "lng": -157.9487, "hasFee": true, "hasAnimal": false, "hasLocation": true}];
const typeColors = {"Drop-in Center": "#ca8a04", "Emergency Shelter": "#2563eb", "Hospital": "#dc2626", "Medical Respite": "#0891b2", "Permanent Supportive Housing": "#059669", "Transitional Housing": "#7c3aed", "Treatment Center": "#ea580c"};

const map = L.map('map', {zoomControl:true, preferCanvas:true}).setView([21.438, -157.99], 10);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom:19,
  attribution:'&copy; OpenStreetMap contributors'
}).addTo(map);

const markerLayer = L.layerGroup().addTo(map);
const markerById = new Map();

function esc(value) {
  return String(value ?? '')
    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
    .replaceAll('"','&quot;').replaceAll("'",'&#039;');
}

function markerIcon(f) {
  const color = typeColors[f['Facility Type']] || '#64748b';
  const fee = f.hasFee ? '<span style="position:absolute;right:-8px;top:-9px;background:#111827;color:#fff;width:16px;height:16px;border-radius:50%;font-size:10px;line-height:16px;text-align:center;border:1px solid white;font-weight:900">$</span>' : '';
  const animal = f.hasAnimal ? '<span style="position:absolute;left:-9px;bottom:-9px;background:#fff;width:17px;height:17px;border-radius:50%;font-size:11px;line-height:17px;text-align:center;border:1px solid #cbd5e1">🐕</span>' : '';
  return L.divIcon({
    className:'',
    html:`<div style="position:relative;width:24px;height:24px"><div class="marker" style="background:${color}"></div>${fee}${animal}</div>`,
    iconSize:[28,28],
    iconAnchor:[14,14],
    popupAnchor:[0,-13]
  });
}

function popupHtml(f) {
  const lines = [
    ['Facility type', f['Facility Type']],
    ['Specialty', f.Specialty],
    ['Address', f.Address],
    ['Phone', f.Phone],
    ['Capacity', f.Capacity],
    ['Services for', f['Services for']],
    ['Council district', f['City Council District'] ? 'District ' + f['City Council District'] : ''],
    ['Fee', f.Fee],
    ['Support/service animals', f['Support/Service Animals']]
  ].filter(x => x[1]);

  return `<div class="popup-title">${esc(f.Name)}</div>
    <div class="popup-agency">${esc(f.Agency)}</div>
    <div class="popup-grid">${lines.map(x => `<div class="popup-label">${esc(x[0])}</div><div>${esc(x[1])}</div>`).join('')}</div>
    <div class="badges">
      ${f.hasFee ? '<span class="badge">$ Fee</span>' : ''}
      ${f.hasAnimal ? '<span class="badge">🐕 Animals accepted</span>' : ''}
      ${f.KCC === 'True' || f.KCC === 'true' ? '<span class="badge">KCC</span>' : ''}
    </div>`;
}

function normalizePopulation(value) {
  return String(value || '').toLowerCase().replaceAll('&',' and ').replace(/\s+/g,' ').trim();
}

function servicesMatch(f, selected) {
  if (!selected) return true;
  const service = normalizePopulation(f['Services for']);
  const type = f['Facility Type'];

  // Hospitals stay separate unless Hospital is explicitly chosen.
  if (type === 'Hospital' && document.getElementById('type').value !== 'Hospital') return false;

  if (selected === 'All Populations') return true;
  if (selected === 'Adults') return service.includes('adult') || service.includes('everyone');
  if (selected === 'Adult Men') return service.includes('adult men') || service === 'men' || service.includes('men only');
  if (selected === 'Adult Women') return service.includes('adult women') || service === 'women' || service.includes('women only');
  if (selected === 'Couples') return service.includes('couples') || service.includes('couple') || service.includes('everyone');
  if (selected === 'Families') return service.includes('families') || service.includes('family') || service.includes('everyone');
  if (selected === 'Youth') return service.includes('youth') || service.includes('children') || service.includes('everyone');
  return true;
}

function currentFiltered() {
  const q = document.getElementById('search').value.trim().toLowerCase();
  const type = document.getElementById('type').value;
  const services = document.getElementById('services').value;
  const district = document.getElementById('district').value;

  return facilities.filter(f => {
    const haystack = [f.Name,f.Agency,f.Address,f['Facility Type'],f.Specialty,f['Services for']].join(' ').toLowerCase();
    return (!q || haystack.includes(q))
      && (!type || f['Facility Type'] === type)
      && (!district || f['City Council District'] === district)
      && servicesMatch(f, services);
  });
}

function render() {
  markerLayer.clearLayers();
  markerById.clear();
  const list = document.getElementById('list');
  list.innerHTML = '';

  const filtered = currentFiltered();
  const mapped = filtered.filter(f => f.hasLocation);
  const unmapped = filtered.filter(f => !f.hasLocation);

  mapped.forEach(f => {
    const marker = L.marker([f.lat, f.lng], {icon:markerIcon(f)})
      .bindPopup(popupHtml(f))
      .bindTooltip(`<b>${esc(f.Name)}</b><br>${esc(f['Facility Type'])}<br>${esc(f['Services for'])}`, {direction:'top'});
    marker.addTo(markerLayer);
    markerById.set(f.id, marker);
  });

  filtered.forEach(f => {
    const color = typeColors[f['Facility Type']] || '#64748b';
    const card = document.createElement('div');
    card.className = 'card' + (f.hasLocation ? '' : ' unmapped');
    card.style.borderLeftColor = color;
    card.innerHTML = `<div class="name">${esc(f.Name)}</div>
      <div class="meta">${esc(f.Agency)} · ${esc(f['Facility Type'])}</div>
      <div class="meta">${esc(f['Services for']) || 'Services not listed'}${f.hasLocation ? '' : ' · Map location unavailable'}</div>`;
    card.addEventListener('click', () => {
      const marker = markerById.get(f.id);
      if (marker) {
        map.setView(marker.getLatLng(), Math.max(map.getZoom(), 14));
        marker.openPopup();
      }
    });
    list.appendChild(card);
  });

  document.getElementById('count').textContent =
    `${filtered.length} resource${filtered.length === 1 ? '' : 's'} shown` +
    (unmapped.length ? ` · ${unmapped.length} without a mappable location` : '');
  document.getElementById('status').textContent =
    mapped.length ? 'Filters applied successfully.' : 'No mapped facilities match these filters.';
}

function resetFilters() {
  document.getElementById('search').value = '';
  document.getElementById('type').value = '';
  document.getElementById('services').value = '';
  document.getElementById('district').value = '';
  render();
  map.setView([21.438, -157.99], 10);
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('type').addEventListener('change', render);
document.getElementById('services').addEventListener('change', render);
document.getElementById('district').addEventListener('change', render);
document.getElementById('reset').addEventListener('click', resetFilters);

const legend = document.getElementById('legend');
Object.entries(typeColors).forEach(([label,color]) => {
  const item = document.createElement('div');
  item.className = 'legend-item';
  item.innerHTML = `<span class="legend-dot" style="background:${color}"></span><span>${label}</span>`;
  legend.appendChild(item);
});

render();
setTimeout(() => map.invalidateSize(true), 150);
window.addEventListener('load', () => map.invalidateSize(true));
window.addEventListener('resize', () => map.invalidateSize(true));
</script>
